<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · GEEKLEARN GAMES</title>
<link rel="icon" type="image/png" href="/assets/icons/favicon-96x96.png" sizes="96x96">
<link rel="stylesheet" href="/css/fonts.css?v=2">
<style>
  :root{ --ease:cubic-bezier(.19,1,.22,1); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#050505; color:#fff;
    font-family:'Inter','Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .wrap{ max-width:560px; }
  .eyebrow{
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:.62rem; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(255,255,255,.45);
  }
  .eyes{ position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); width:.24em; }
  .eyes ellipse{ transform-origin:center; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1); } 95%,97%{ transform:scaleY(.06); } }
  .eyes .lid{ animation:blink 5.6s ease-in-out infinite; }
  .code{
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    font-weight:850; font-stretch:112%; letter-spacing:-.012em;
    font-size:clamp(5rem,22vw,9.5rem); line-height:.9;
    margin:26px 0 18px;
  }
  .code .zero{ position:relative; display:inline-block; }
  .line{ color:rgba(255,255,255,.62); font-size:.95rem; line-height:1.6; margin-bottom:34px; }
  .btn{
    display:inline-block; padding:14px 30px; border:1px solid #fff; color:#fff;
    background:transparent; text-decoration:none; border-radius:0; white-space:nowrap;
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;
    transition:background .25s var(--ease), color .25s var(--ease);
  }
  .btn:hover{ background:#fff; color:#000; }
  .btn:focus-visible{ outline:1px solid rgba(255,255,255,.85); outline-offset:3px; }
  [dir="rtl"] .btn, [dir="rtl"] .eyebrow{ letter-spacing:0; }
  ::selection{ background:#fff; color:#000; }
  @media (prefers-reduced-motion: reduce){ .eyes .lid{ animation:none; } }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">GEEKLEARN GAMES</p>
    <h1 class="code" aria-label="404">4<span class="zero">0<svg class="eyes" viewBox="0 0 74 22" fill="none" aria-hidden="true">
      <g class="lid">
        <circle cx="20" cy="11" r="5" fill="#fff"/>
        <circle cx="54" cy="11" r="5" fill="#fff"/>
      </g>
    </svg></span>4</h1>
    <p class="line" id="l"></p>
    <a class="btn" id="b" href="/"></a>
  </main>
  <script>
    (function () {
      var T = {
        fr: ['Cette page s’est perdue dans le noir.', 'Retour à l’accueil'],
        en: ['This page wandered into the dark.', 'Back to home'],
        es: ['Esta página se perdió en la oscuridad.', 'Volver al inicio'],
        de: ['Diese Seite hat sich im Dunkeln verirrt.', 'Zurück zur Startseite'],
        it: ['Questa pagina si è persa nel buio.', 'Torna alla home'],
        ar: ['ضاعت هذه الصفحة في الظلام.', 'العودة إلى الرئيسية'],
        zh: ['这个页面迷失在黑暗中。', '返回首页'],
        ja: ['このページは闇の中に迷い込みました。', 'ホームへ戻る'],
        ru: ['Эта страница заблудилась в темноте.', 'На главную'],
        pl: ['Ta strona zgubiła się w ciemności.', 'Wróć na stronę główną']
      };
      var lang = 'en';
      try { lang = localStorage.getItem('glg_lang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
      if (!T[lang]) lang = 'en';
      document.documentElement.lang = lang;
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      document.getElementById('l').textContent = T[lang][0];
      document.getElementById('b').textContent = T[lang][1];
      document.title = '404 · GEEKLEARN GAMES';
    })();
  </script>
</body>
</html>
